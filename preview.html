                </div>
              </div>

              {/* State Filter Buttons */}
              <div className="flex flex-wrap items-center gap-2 mb-6">
                <button
                  onClick={() => setFilterState('All')}
                  className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${
                    filterState === 'All' ? 'bg-neutral-900 text-white' : 'bg-white text-neutral-700 border border-neutral-200'
                  }`}
                >
                  All Destinations ({destinationsData.length})
                </button>
                <button
                  onClick={() => setFilterState('Himachal Pradesh')}
                  className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${
                    filterState === 'Himachal Pradesh' ? 'bg-amber-600 text-white' : 'bg-white text-neutral-700 border border-neutral-200'
                  }`}
                >
                  🏔️ Himachal Pradesh (5)
                </button>
                <button
                  onClick={() => setFilterState('Uttarakhand')}
                  className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${
                    filterState === 'Uttarakhand' ? 'bg-emerald-700 text-white' : 'bg-white text-neutral-700 border border-neutral-200'
                  }`}
                >
                  🕉️ Uttarakhand (5)
                </button>
              </div>

              {/* Tour Cards Grid */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                {filteredList.map((dest) => {
                  const isFav = favorites[dest.id];
                  return (
                    <div 
                      key={dest.id}
                      onClick={() => setActiveTourModal(dest)}
                      className="group bg-white rounded-3xl overflow-hidden border border-neutral-200/80 shadow-sm hover:shadow-2xl transition-all duration-300 flex flex-col cursor-pointer transform hover:-translate-y-1.5"
                    >
                      <div className="relative aspect-[4/3] overflow-hidden bg-neutral-100">
                        <img 
                          src={dest.image} 
                          alt={dest.title} 
                          className="w-full h-full object-cover group-hover:scale-108 transition-transform duration-700"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>

                        <div className="absolute top-3 left-3 flex flex-col gap-1 items-start">
                          <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full text-white ${
                            dest.state === 'Himachal Pradesh' ? 'bg-amber-600/90' : 'bg-emerald-700/90'
                          }`}>
                            {dest.state === 'Himachal Pradesh' ? '🏔️ Himachal' : '🕉️ Uttarakhand'}
                          </span>
                        </div>

                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            setFavorites({ ...favorites, [dest.id]: !isFav });
                          }}
                          className="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/80 hover:bg-white flex items-center justify-center text-neutral-700 shadow-sm"
                        >
                          <Icon name="heart" className={`w-4 h-4 ${isFav ? 'text-red-500 fill-red-500' : 'text-neutral-700'}`} />
                        </button>

                        <div className="absolute bottom-3 left-3 right-3 text-white text-[11px] font-semibold truncate flex items-center gap-1">
                          <Icon name="map-pin" className="w-3 h-3 text-amber-400 flex-shrink-0" />
                          <span>{dest.location}</span>
                        </div>
                      </div>

                      <div className="p-5 flex-1 flex flex-col justify-between space-y-4">
                        <div>
                          <div className="flex items-center justify-between text-xs text-neutral-500 mb-1.5">
                            <span>{dest.duration}</span>
                            <span className="font-bold text-neutral-800 flex items-center gap-1">
                              ★ {dest.rating} ({dest.reviewsCount})
                            </span>
                          </div>

                          <h3 className="text-base font-bold text-neutral-900 group-hover:text-amber-700 transition-colors line-clamp-2">
                            {dest.title}
                          </h3>

                          <p className="text-xs text-neutral-500 mt-2 line-clamp-2">
                            {dest.overview}
                          </p>
                        </div>

                        <div className="pt-3 border-t border-neutral-100 flex items-center justify-between">
                          <div>
                            <span className="text-[10px] uppercase font-bold text-neutral-400 block">From</span>
                            <div className="text-lg font-extrabold text-neutral-950">
                              ₹{dest.price.toLocaleString()} <span className="text-[11px] text-neutral-400 font-normal">/ person</span>
                            </div>
                          </div>

                          <button 
                            className="w-9 h-9 rounded-full bg-neutral-900 group-hover:bg-amber-600 text-white flex items-center justify-center transition-colors shadow-sm"
                          >
                            <Icon name="arrow-right" className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

            </div>
          </section>

          {/* 3 CORE PILLARS & TESTIMONIALS (Verbatim from Reference Image) */}
          <section className="py-20 sm:py-28 bg-white border-t border-neutral-100">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              
              {/* 3 Pillars */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-8 pb-20 border-b border-neutral-200">
                <div className="space-y-3">
                  <div className="w-12 h-12 rounded-2xl bg-neutral-100 flex items-center justify-center text-neutral-800">
                    <Icon name="compass" className="w-6 h-6" />
                  </div>
                  <h3 className="text-xl font-bold text-neutral-900">Ease of travel</h3>
                  <p className="text-sm text-neutral-500 leading-relaxed">
                    A good travel experience is not just about the places visited; our verified hill drivers and luxury Volvo coaches make your journey comfortable.
                  </p>
                </div>

                <div className="space-y-3">
                  <div className="w-12 h-12 rounded-2xl bg-neutral-100 flex items-center justify-center text-neutral-800">
                    <Icon name="users" className="w-6 h-6" />
                  </div>
                  <h3 className="text-xl font-bold text-neutral-900">Local Staff Help</h3>
                  <p className="text-sm text-neutral-500 leading-relaxed">
                    Professional native guides ensure you will not miss hidden paradise places, sacred shrines, and secluded valleys.
                  </p>
                </div>

                <div className="space-y-3">
                  <div className="w-12 h-12 rounded-2xl bg-neutral-100 flex items-center justify-center text-neutral-800">
                    <Icon name="shield-check" className="w-6 h-6" />
                  </div>
                  <h3 className="text-xl font-bold text-neutral-900">Safe and reliable</h3>
                  <p className="text-sm text-neutral-500 leading-relaxed">
                    Experience and certified mountain drivers ensure your safety is guaranteed with 24/7 hill emergency and weather support.
                  </p>
                </div>
              </div>

              {/* Get a good travel experience (Verbatim Quote Section from Reference) */}
              <div className="pt-20">
                <div className="text-center max-w-2xl mx-auto mb-16 space-y-3">
                  <span className="text-xs font-bold uppercase tracking-widest text-amber-700 bg-amber-50 px-3.5 py-1 rounded-full">
                    Traveler Reflections
                  </span>
                  <h2 className="text-3xl sm:text-5xl font-bold tracking-tight text-neutral-900">
                    Get a good travel experience
                  </h2>
                  <p className="text-sm sm:text-base text-neutral-500">
                    A good travel experience is not just about the places visited, but also the stories and lessons brought back home.
                  </p>
                </div>

                {/* Review Card */}
                <div className="max-w-4xl mx-auto bg-[#FBFBFA] rounded-3xl p-8 sm:p-12 shadow-xl border border-neutral-200">
                  <div className="flex items-center gap-1 text-amber-400 mb-4">
                    {'★★★★★'}
                  </div>
                  <blockquote className="text-xl sm:text-2xl font-light text-neutral-800 italic leading-relaxed mb-6">
                    "{reviewsData[reviewIndex].comment}"
                  </blockquote>

                  <div className="flex items-center justify-between pt-6 border-t border-neutral-200">
                    <div className="flex items-center gap-3">
                      <img 
                        src={reviewsData[reviewIndex].avatar} 
                        alt={reviewsData[reviewIndex].name} 
                        className="w-12 h-12 rounded-full object-cover border-2 border-white shadow"
                      />
                      <div>
                        <h4 className="font-bold text-neutral-900 text-sm">{reviewsData[reviewIndex].name}</h4>
                        <p className="text-xs text-neutral-500">{reviewsData[reviewIndex].role} · {reviewsData[reviewIndex].date}</p>
                      </div>
                    </div>

                    <div className="flex items-center gap-2">
                      <button 
                        onClick={() => setReviewIndex(prev => prev === 0 ? reviewsData.length - 1 : prev - 1)}
                        className="w-9 h-9 rounded-full border border-neutral-300 hover:bg-neutral-900 hover:text-white flex items-center justify-center text-xs"
                      >
                        ←
                      </button>
                      <button 
                        onClick={() => setReviewIndex(prev => prev === reviewsData.length - 1 ? 0 : prev + 1)}
                        className="w-9 h-9 rounded-full border border-neutral-300 hover:bg-neutral-900 hover:text-white flex items-center justify-center text-xs"
                      >
                        →
                      </button>
                    </div>
                  </div>
                </div>

              </div>

            </div>
          </section>

          {/* CONTACT & CONSULTATION */}
          <section id="contact" className="py-20 sm:py-28 bg-[#FBFBFA]">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
                <div className="lg:col-span-5 bg-neutral-950 text-white rounded-3xl p-8 space-y-6 shadow-xl">
                  <div>
                    <span className="text-xs uppercase tracking-wider text-amber-400 font-bold block mb-1">
                      Himachal Pradesh Headquarters
                    </span>
                    <h3 className="text-2xl font-bold">{businessDetails.name}</h3>
                    <p className="text-xs text-neutral-400 mt-1">{businessDetails.location}</p>
                  </div>

                  <div className="space-y-3 pt-2 text-xs sm:text-sm text-neutral-300">
                    <p><span className="font-bold text-white">Toll-Free:</span> {businessDetails.tollFree}</p>
                    <p><span className="font-bold text-white">Manali Desk:</span> {businessDetails.phone}</p>
                    <p><span className="font-bold text-white">Email:</span> {businessDetails.email}</p>
                    <p><span className="font-bold text-white">Branches:</span> Dehradun, Rishikesh, Shimla & New Delhi</p>
                  </div>

                  <a 
                    href={`https://wa.me/${businessDetails.whatsappNumber}`}
                    target="_blank"
                    className="w-full py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm flex items-center justify-center gap-2 shadow"
                  >
                    <span>Instant WhatsApp Inquiry: {businessDetails.whatsappDisplay}</span>
                  </a>
                </div>

                <div className="lg:col-span-7 bg-white rounded-3xl p-8 border border-neutral-200 shadow-sm">
                  <h3 className="text-2xl font-bold text-neutral-900 mb-2">Request Custom Himalayan Itinerary</h3>
                  <p className="text-xs text-neutral-500 mb-6">Our local travel coordinator will reply on WhatsApp or phone within 15 minutes.</p>

                  <form 
                    onSubmit={async (e) => {
                      e.preventDefault();
                      const form = e.target;
                      const name = form.travelerName.value;
                      const phone = form.travelerPhone.value;
                      const state = form.travelerState.value;
                      const service = form.travelerService.value;
                      const notes = form.travelerNotes.value;

                      showToast("Namaste! Submitting your inquiry to Supabase...");
                      await supabaseInsert('inquiries', {
                        name: name,
                        email: 'inquiry@tourexhimalayas.in',
                        phone: phone,
                        service: `${service} (${state})`,
                        message: notes,
                        status: 'pending'
                      });

                      showToast("Inquiry saved to Supabase! Our team will contact you on WhatsApp.");
                      form.reset();
                    }}
                    className="space-y-4"
                  >
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <input 
                        type="text" 
                        name="travelerName"
                        required 
                        placeholder="Your Name *"
                        className="w-full px-4 py-3 rounded-2xl bg-neutral-50 border border-neutral-200 text-xs sm:text-sm focus:outline-none focus:border-neutral-900"
                      />
                      <input 
                        type="tel" 
                        name="travelerPhone"
                        required 
                        placeholder="WhatsApp Phone Number *"
                        className="w-full px-4 py-3 rounded-2xl bg-neutral-50 border border-neutral-200 text-xs sm:text-sm focus:outline-none focus:border-neutral-900"
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <select name="travelerState" className="w-full px-4 py-3 rounded-2xl bg-neutral-50 border border-neutral-200 text-xs sm:text-sm">
                        <option>Himachal Pradesh (Manali, Spiti, Kasol, Shimla)</option>
                        <option>Uttarakhand (Kedarnath, Rishikesh, Nainital, Auli)</option>
                        <option>Grand Himachal & Uttarakhand Circuit</option>
                      </select>
                      <select name="travelerService" className="w-full px-4 py-3 rounded-2xl bg-neutral-50 border border-neutral-200 text-xs sm:text-sm">
                        <option>Family / Couple Leisure Tour</option>
                        <option>Spiti 4x4 High-Altitude Road Trip</option>
                        <option>Kedarnath & Badrinath Sacred Yatra</option>
                        <option>Adventure Treks & Rafting</option>
                      </select>
                    </div>

                    <textarea 
                      name="travelerNotes"
                      rows={3}
                      placeholder="Travel dates, number of persons, pickup preferences..."
                      className="w-full px-4 py-3 rounded-2xl bg-neutral-50 border border-neutral-200 text-xs sm:text-sm focus:outline-none focus:border-neutral-900"
                    ></textarea>

                    <button
                      type="submit"
                      className="px-8 py-3.5 rounded-full bg-neutral-950 text-white font-bold text-xs sm:text-sm hover:bg-black transition-all shadow-lg cursor-pointer"
                    >
                      Send Inquiry (Saves to Supabase)
                    </button>
                  </form>
                </div>
              </div>

            </div>
          </section>

          {/* FOOTER */}
          <footer className="bg-[#0E1318] text-white py-12 border-t border-white/10 text-xs text-neutral-400">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
              <p>© 2026 {businessDetails.name} ({businessDetails.legalName}). Licensed & Registered in Himachal Pradesh.</p>
              <div className="flex gap-4">
                <span>Toll-Free: {businessDetails.tollFree}</span>
                <span>•</span>
                <span>Manali Desk: {businessDetails.phone}</span>
              </div>
            </div>
          </footer>

          {/* TOUR MODAL WITH BOOKING & VOUCHER GENERATOR */}
          {activeTourModal && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-4">
              <div className="relative bg-white w-full max-w-3xl rounded-3xl overflow-hidden shadow-2xl border border-neutral-200 my-6">
                
                <button
                  onClick={() => setActiveTourModal(null)}
                  className="absolute top-4 right-4 z-20 w-9 h-9 rounded-full bg-black/60 text-white flex items-center justify-center"
                >
                  ✕
                </button>

                <div className="relative h-56 w-full overflow-hidden">
                  <img src={activeTourModal.image} alt={activeTourModal.title} className="w-full h-full object-cover" />
                  <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent"></div>
                  <div className="absolute bottom-4 left-4 right-4 text-white">
                    <span className="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-600 uppercase">
                      {activeTourModal.state}
                    </span>
                    <h2 className="text-xl sm:text-2xl font-bold mt-1">{activeTourModal.title}</h2>
                    <p className="text-xs text-white/80">{activeTourModal.duration} · ★ {activeTourModal.rating}</p>
                  </div>
                </div>

                <div className="p-6 max-h-[60vh] overflow-y-auto space-y-5 text-xs sm:text-sm">
                  
                  {/* Highlights */}
                  <div>
                    <h4 className="font-bold text-neutral-900 uppercase text-xs tracking-wider mb-2">Package Highlights</h4>
                    <ul className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-neutral-700">
                      {activeTourModal.highlights.map((h, i) => (
                        <li key={i} className="flex items-start gap-1.5">
                          <span className="text-emerald-600 font-bold">✓</span>
                          <span>{h}</span>
                        </li>
                      ))}
                    </ul>
                  </div>

                  {/* Day-by-day Itinerary */}
                  <div className="border-t border-neutral-200 pt-4">
                    <h4 className="font-bold text-neutral-900 uppercase text-xs tracking-wider mb-3">Day-by-Day Journey</h4>
                    <div className="space-y-2.5">
                      {activeTourModal.itinerary.map((day, idx) => (
                        <div key={idx} className="p-3 bg-neutral-50 rounded-xl border border-neutral-200">
                          <span className="font-bold text-amber-700 text-xs">{day.day}: {day.title}</span>
                          <p className="text-xs text-neutral-600 mt-0.5">{day.desc}</p>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Inclusions */}
                  <div className="border-t border-neutral-200 pt-4">
                    <h4 className="font-bold text-neutral-900 uppercase text-xs tracking-wider mb-2">Inclusions</h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {activeTourModal.included.map((inc, i) => (
                        <div key={i} className="p-2 rounded-lg bg-emerald-50 text-emerald-900 text-xs font-medium">
                          ✓ {inc}
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Booking CTA Bar */}
                  <div className="border-t border-neutral-200 pt-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div>
                      <span className="text-[10px] uppercase font-bold text-neutral-400 block">Package Price</span>
                      <span className="text-2xl font-extrabold text-neutral-950 font-display">
                        ₹{activeTourModal.price.toLocaleString()} <span className="text-xs text-neutral-500 font-normal">/ person</span>
                      </span>
                    </div>

                    <a
                      href={`https://wa.me/${businessDetails.whatsappNumber}?text=Namaste!%20I%20want%20to%20reserve%20the%20"${encodeURIComponent(activeTourModal.title)}"%20for%20my%20upcoming%20travel.`}
                      target="_blank"
                      onClick={() => {
                        supabaseInsert('bookings', {
                          tour_title: activeTourModal.title,
                          location: activeTourModal.location,
                          client_name: 'WhatsApp Traveler',
                          email: 'guest@tourexhimalayas.in',
                          total_price: '₹' + activeTourModal.price.toLocaleString(),
                          notes: 'Triggered via WhatsApp Reservation Button',
                          status: 'requested'
                        });
                        showToast("Booking recorded in Supabase! Redirecting to WhatsApp...");
                      }}
                      className="w-full sm:w-auto px-6 py-3 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm text-center shadow-lg cursor-pointer"
                    >
                      Book Tour on WhatsApp
                    </a>
                  </div>

                </div>

              </div>
            </div>
          )}

          {/* SIGN IN / TRACK MODAL */}
          {signInOpen && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="relative bg-white w-full max-w-md rounded-3xl p-6 sm:p-8 space-y-5">
                <button
                  onClick={() => setSignInOpen(false)}
                  className="absolute top-4 right-4 w-8 h-8 rounded-full bg-neutral-100 flex items-center justify-center text-xs"
                >
                  ✕
                </button>

                <div className="text-center">
                  <h3 className="text-2xl font-bold text-neutral-900">Sign In / Track Booking</h3>
                  <p className="text-xs text-neutral-500 mt-1">Check your reserved hill vehicle & hotel voucher status.</p>
                </div>

                <form 
                  onSubmit={(e) => {
                    e.preventDefault();
                    showToast("Signed in successfully!");
                    setSignInOpen(false);
                  }}
                  className="space-y-3"
                >
                  <div>
                    <label className="block text-xs font-bold text-neutral-700 mb-1">Booking Reference or Phone (+91)</label>
                    <input 
                      type="text" 
                      required 
                      placeholder="e.g. HEX-HP-8942 or +91 77659..."
                      className="w-full px-4 py-2.5 rounded-2xl bg-neutral-50 border border-neutral-200 text-xs sm:text-sm"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-neutral-700 mb-1">Password / OTP</label>
                    <input 
                      type="password" 
                      required 
                      placeholder="••••••••"
                      className="w-full px-4 py-2.5 rounded-2xl bg-neutral-50 border border-neutral-200 text-xs sm:text-sm"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 rounded-full bg-neutral-950 text-white font-bold text-xs sm:text-sm"
                  >
                    Track Status / Sign In
                  </button>
                </form>

                <p className="text-center text-xs text-neutral-400">
                  Toll-Free Assistance: <span className="font-bold text-neutral-800">{businessDetails.tollFree}</span>
                </p>
              </div>
            </div>
          )}

          {/* FLOATING WHATSAPP BUTTON */}
          <a
            href={`https://wa.me/${businessDetails.whatsappNumber}?text=Namaste%20Tourex%20Himalayas!%20I%20am%20looking%20for%20a%20tour%20package.`}
            target="_blank"
            className="fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center shadow-2xl transition-transform hover:scale-110"
            title="Chat with Pahadi Concierge on WhatsApp"
          >
            <Icon name="message-circle" className="w-7 h-7" />
          </a>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
